<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>TODO LIST</h1>
        <div class="counters">
            <h3 id="not-started-count">NOT STARTED</h3>
            <h3 id="in-progress-count">IN PROGRESS</h3>
            <h3 id="done-count">DONE</h3>
        </div>
    </header>
    <main>
        <div>
            <input id="input-task" type="text" placeholder="Write a task, press Enter">
            <button id="add-button">ADD</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
